<head>

<meta name="description" content="Ankara Anıttepe Rotaract Kulübü Başkan Mektubu'nun yayımlanan tüm sayıları: dönemin projeleri, yönetim kurulu mesajları ve kulübümüzden haberler. Çevrim içi oku ya da PDF olarak indir.">

<meta property="og:description" content="Başkan Mektubu'nun yayımlanan tüm sayıları. Çevrim içi oku ya da PDF olarak indir.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap">
<link rel="stylesheet" href="/assets/css/letter.css?v=202611162002">
<style>
:root{
  --cran:#D41367; --cran-deep:#A30C4D; --cran-soft:#FCE6EF; --gold:#F7A81B;
  --ink:#1E1420; --muted:#6E5F69; --line:#EFE3E9; --bg-2:#FBF6F8;
  --f:"Open Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

.hdr{background:#fff;border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
/* Logo çerçevesi anasayfadakiyle aynı kırpımı kullanır. */
.lg{position:relative;aspect-ratio:1330/470;overflow:hidden;display:block;width:150px}
.lg img{position:absolute;max-width:none;width:150.38%;left:-38.72%;top:-6.38%;height:auto}
.hdr nav a{font-weight:600;font-size:.95rem;text-decoration:none;color:var(--cran-deep)}
.hdr nav a:hover{color:var(--cran)}

main{flex:1;padding:40px 0 64px}
.kicker{color:var(--cran);font-weight:700;font-size:.95rem}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.08;font-weight:800;letter-spacing:-.025em;margin:6px 0 10px;text-wrap:balance}
.lead{color:var(--muted);max-width:640px;margin:0}

.btn{display:inline-flex;align-items:center;gap:8px;font:700 1rem var(--f);padding:12px 22px;border-radius:999px;border:2px solid transparent;cursor:pointer;text-decoration:none;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-cran{background:var(--cran);color:#fff}
.btn-cran:hover{background:var(--cran-deep)}
.btn-line{border-color:currentColor;background:transparent;color:var(--cran-deep)}
@media (hover:none){.btn:hover,.issue a:hover{transform:none}}

.state{margin:40px 0 0;padding:40px 24px;border-radius:24px;background:var(--bg-2);border:1px solid var(--line);text-align:center;color:var(--muted)}
.state p{margin:0 0 6px}
.state strong{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}
.state .btn{margin-top:16px}

/* Liste */
.issues{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 24px}
.issue{min-width:0} /* 810px'lik sayfa ızgara sütununu genişletmesin */
.issue a{display:block;text-decoration:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.issue a:hover{transform:translateY(-4px)}
.issue a:hover h2{color:var(--cran)}
.thumb{border-radius:14px;overflow:hidden;line-height:0;box-shadow:0 10px 30px -12px rgba(80,0,35,.4);background:var(--cran-deep)}
.issue h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:14px 0 2px}
.issue p{color:var(--muted);font-size:.95rem;margin:0}

/* Okuyucu */
.rd-back{display:inline-block;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--cran-deep);margin-bottom:18px}
.rd-back:hover{color:var(--cran)}
.rd-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:20px 0 32px}
.rd-hint{font-size:.85rem;color:var(--muted);margin:0}
.rd-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:40px}
.rd-nav .next{margin-left:auto}
@media screen{
  #pages.lt-pages{width:100%;max-width:810px;margin:0 auto}
}

.ftr{border-top:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-size:.88rem}
.ftr .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ftr a{color:var(--cran-deep);font-weight:600;text-decoration:none}

@media (max-width:600px){
  main{padding:28px 0 48px}
  .lg{width:124px}
  .issues{grid-template-columns:1fr 1fr;gap:22px 14px}
  .issue h2{font-size:1rem}
  .issue p{font-size:.85rem}
}

@media print{
  .hdr,.ftr,.rd-head,.rd-back,.rd-bar,.rd-nav{display:none !important}
  body{display:block;min-height:0;background:#fff}
  main{padding:0}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<header class="hdr">
  <div class="wrap">
    <a class="lg" href="/" aria-label="Anasayfa"><img src="/assets/logo-cranberry.webp" alt="Ankara Anıttepe Rotaract Kulübü logosu"></a>
    <nav aria-label="Site"><a href="/">Anasayfa</a></nav>
  </div>
</header>

<main id="main">
  <div class="wrap" id="app">
    <span class="kicker">Başkan Mektubu</span>
    <h1>Başkan Mektupları</h1>
    <div class="state" role="status" aria-live="polite"><p>Yükleniyor…</p></div>
  </div>
</main>

<footer class="ftr">
  <div class="wrap">
    <span>© <span id="yr">2026</span> Ankara Anıttepe Rotaract Kulübü · 1996'dan beri</span>
    <a href="/">anitteperotaract.org</a>
  </div>
</footer>

<script type="module">
import { CONFIG } from "/uye/js/config.js?v=202611162002";
import { renderLetter, renderPage, tocFromPages, esc } from "/assets/js/letter-render.js?v=202611162002";

const TITLE = "Başkan Mektubu · Ankara Anıttepe Rotaract Kulübü";
const LOGO = "/assets/logo-beyaz.webp";
const API = `${CONFIG.SUPABASE_URL}/rest/v1/letters?select=id,term_id,issue_no,period,published_at,published_pages&status=eq.yayinda`;
const app = document.getElementById("app");
document.getElementById("yr").textContent = new Date().getFullYear();

const photoUrl = r => (typeof r === "string" ? r : (r?.url || ""));

// Dönem temmuzda başlar: Temmuz 2026 – Haziran 2027 → "2026-27".
// Ay, ziyaretçinin saat diliminden bağımsız olarak İstanbul saatine göre alınır (temmuz sınırı herkeste aynı).
const TR_YM = new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Istanbul", year: "numeric", month: "numeric" });
function termOf(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return "";
  const p = Object.fromEntries(TR_YM.formatToParts(d).map(x => [x.type, x.value]));
  const y = +p.month >= 7 ? +p.year : +p.year - 1;
  return `${y}-${String(y + 1).slice(-2)}`;
}
// Yeni dönem önce, dönem içinde büyük sayı önce (yeniden yayın sırayı bozmaz).
const byNewest = (a, b) => (a.term < b.term ? 1 : a.term > b.term ? -1 : (+b.issue_no || 0) - (+a.issue_no || 0));
const hrefOf = l => `/mektup/?donem=${encodeURIComponent(l.term)}&sayi=${encodeURIComponent(l.issue_no)}`;
const pageOpts = l => ({ photoUrl, logoUrl: LOGO, letter: { issue_no: l.issue_no, period: l.period }, toc: tocFromPages(l.pages) });
const head = (title, lead) => `<div class="rd-head"><span class="kicker">Başkan Mektubu</span><h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}</div>`;

// Sayfaları kapsayıcı genişliğine sığdır: --lt-scale = min(1, genişlik / 810).
function scale(el) {
  const w = el.clientWidth;
  if (w) el.style.setProperty("--lt-scale", String(Math.min(1, w / 810)));
}
const ro = new ResizeObserver(entries => entries.forEach(e => scale(e.target)));
function fit() { app.querySelectorAll("[data-fit]").forEach(el => { scale(el); ro.observe(el); }); }

async function load() {
  const key = CONFIG.SUPABASE_ANON_KEY;
  const res = await fetch(API, { headers: { apikey: key, Authorization: `Bearer ${key}` } });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const rows = await res.json();
  return rows
    .filter(r => Array.isArray(r.published_pages) && r.published_pages.length)
    .map(r => ({ ...r, pages: r.published_pages, term: termOf(r.published_at) }))
    .filter(r => r.term)
    .sort(byNewest);
}

// Tek bir bozuk sayı tüm listeyi düşürmesin: küçük resmi çizilemezse boş kapak kalır.
function thumbOf(l) {
  try { return renderPage(l.pages[0], pageOpts(l)); }
  catch (err) { console.error("Kapak çizilemedi", l.id, err); return ""; }
}
function showError(title, msg) {
  app.innerHTML = `${head(title)}<div class="state" role="alert"><strong>${msg}</strong><p>Biraz sonra tekrar dene.</p><a class="btn btn-cran" href="/mektup/">Tüm sayılar</a></div>`;
}

function showList(letters) {
  document.title = TITLE;
  const intro = head("Başkan Mektupları", "Dönemin projeleri, yönetim kurulu mesajları ve kulübümüzden haberler. Bir sayıyı seçip çevrim içi oku ya da PDF olarak indir.");
  if (!letters.length) {
    app.innerHTML = `${intro}<div class="state"><strong>Henüz yayımlanmış sayı yok.</strong><p>İlk sayı yayımlandığında burada olacak.</p><a class="btn btn-line" href="/">Anasayfaya dön</a></div>`;
    return;
  }
  app.innerHTML = `${intro}<ul class="issues">${letters.map(l => `
    <li class="issue"><a href="${esc(hrefOf(l))}">
      <div class="thumb" data-fit aria-hidden="true">${thumbOf(l)}</div>
      <h2>Sayı ${esc(l.issue_no)}</h2>
      <p>${esc([l.period, `${l.term} dönemi`].filter(Boolean).join(" · "))}</p>
    </a></li>`).join("")}</ul>`;
  fit();
}

function showReader(letters, term, issue) {
  const i = letters.findIndex(l => l.term === term && String(l.issue_no) === String(issue));
  if (i < 0) {
    document.title = `Sayı bulunamadı · ${TITLE}`;
    app.innerHTML = `${head("Sayı bulunamadı")}<div class="state"><strong>Aradığın sayı burada değil.</strong><p>Bağlantı hatalı olabilir ya da sayı yayından kaldırılmış olabilir.</p><a class="btn btn-cran" href="/mektup/">Tüm sayılar</a></div>`;
    return;
  }
  const l = letters[i];
  const older = letters[i + 1], newer = letters[i - 1];
  // Yazdırma penceresi belge başlığını PDF dosya adı olarak önerir.
  document.title = `Başkan Mektubu Sayı ${l.issue_no} (${l.term}) · Ankara Anıttepe Rotaract Kulübü`;
  app.innerHTML = `
    <a class="rd-back" href="/mektup/">← Tüm sayılar</a>
    ${head(`Sayı ${esc(l.issue_no)}`, esc([l.period, `${l.term} dönemi`].filter(Boolean).join(" · ")))}
    <div class="rd-bar">
      <button type="button" class="btn btn-cran" id="pdf">PDF indir</button>
      <p class="rd-hint">Yazdırma penceresinde Hedef: PDF olarak kaydet seç.</p>
    </div>
    <div class="lt-pages" id="pages" data-fit>${renderLetter(l, { editable: false, photoUrl, logoUrl: LOGO })}</div>
    <nav class="rd-nav" aria-label="Sayılar">
      ${older ? `<a class="btn btn-line" href="${esc(hrefOf(older))}">← Sayı ${esc(older.issue_no)}</a>` : ""}
      ${newer ? `<a class="btn btn-line next" href="${esc(hrefOf(newer))}">Sayı ${esc(newer.issue_no)} →</a>` : ""}
    </nav>`;
  document.getElementById("pdf").addEventListener("click", () => window.print());
  fit();
}

async function main() {
  const q = new URLSearchParams(location.search);
  const term = q.get("donem"), issue = q.get("sayi");
  let letters;
  try {
    letters = await load();
  } catch (err) {
    console.error(err);
    app.innerHTML = `${head("Başkan Mektupları")}<div class="state"><strong>Mektuplar şu an yüklenemedi.</strong><p>Bağlantını kontrol edip biraz sonra tekrar dene.</p><button type="button" class="btn btn-cran" id="retry">Tekrar dene</button></div>`;
    document.getElementById("retry").addEventListener("click", () => {
      app.innerHTML = `${head("Başkan Mektupları")}<div class="state" role="status" aria-live="polite"><p>Yükleniyor…</p></div>`;
      main();
    });
    return;
  }
  try {
    if (term && issue) showReader(letters, term, issue);
    else showList(letters);
  } catch (err) {
    console.error(err);
    if (term && issue) showError("Sayı açılamadı", "Bu sayı şu an görüntülenemiyor.");
    else showError("Başkan Mektupları", "Mektuplar şu an görüntülenemiyor.");
  }
}
main();
</script>
</body>
</html>
